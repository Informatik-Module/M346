#cloud-config

users:
  - default   #Erstellt den Standarbenutzer (Ubuntu)

  - name: mischa 
    groups: sudo  #Fügt Mischa zur Sudo Gruppe hinzu für Adminrechte
    sudo: ALL=(ALL) NOPASSWD:ALL   # mischa darf alle Befehle als root ohne Passwort ausführen
    shell: /bin/bash  #Auswahl der Shell
    ssh_authorized_keys:  #Autorisiertet öffentlicher SSH schlüssel hinzufügen damit sich der user anmelden kann (zusätzlich der von der Lehrperson)
      - ssh-rsa 
      - ssh-rsa 

packages: #Package installieren und updaten
  - netcat-openbsd
package_update: true
package_upgrade: true

write_files: 
  - path: /etc/ssh/sshd_config.d/10-m346_hardening.conf  #pfad der datei, "10-" im Namen, damit die Datei vor 50-cloud-init.conf gelesen wird
    content: |  #inhalt wird genau so übernommen wie hier geschrieben (zeilenumbrücher / Leerzeilen etc.). Hardening wird vorgenommen, kein root login, keine passwort authentifizierung und kein interaktives login
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

runcmd: #reload, damit die neue config ausgelesen wird und ein log file
  - systemctl reload ssh
  - touch /var/log/setup-done
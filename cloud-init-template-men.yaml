#cloud-config
package_update: true #von aufgabe

users:    #Um Users zu erstellen
 - default    #Erstellung ubuntu default users

 - name: fynn   #User mit meinem Namen wird erstellt
   groups: sudo   #Fügt in zu der 'Admingruppe' hinzu
   sudo: ALL=(ALL) NOPASSWD:ALL   #Benutzer Sudo darf auf allen hosts Befehle als jeder User ausführen, dies ohne PW und alle Befehle
   shell: /bin/bash #SHell Auswahl
   ssh_authorized_keys:
    - ssh-rsa 
    - ssh-rsa 

packages:
 - nginx #apache2 für Webserver
 - fail2ban # nach mehreren fehlgeschlagenen anmeldevaersuchen wird die ip adress blockiert
 - netcat-openbsd #von aufgabe

write_files:
 - path: /etc/ssh/sshd_config.d/tag2-tst.conf #Pfad wo eine file erstellt wird
   content: |   #heisst das ein mehrzeiliger text in die datei geschrieben wird
     PermitRootLogin no
     PasswordAuthentication no
     KbdInteractiveAuthentication no
#root nicht direkt verbinden | pw anmeldung deactivated | keine interaktive ssh auth

runcmd:   #führt befehl aus
 - systemctl reload ssh   #lädt die shh konfiguration neu
 - touch /var/log/setup-done    #erstellt die datei 'setup-done'

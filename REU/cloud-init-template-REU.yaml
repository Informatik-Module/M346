#cloud-config
# Pflichtzeile: cloud-init erkennt die Datei nur damit

users:
  # Standardbenutzer (ubuntu) behalten
  - default
  # Neuer Benutzer mit eigenem Namen
  - name: yuma
    # Gruppe sudo = Admin-Rechte
    groups: sudo
    # sudo ohne Passwort
    sudo: ALL=(ALL) NOPASSWD:ALL
    # Standard-Shell
    shell: /bin/bash
    # Public Key von mir
    ssh_authorized_keys:
      - ssh-rsa  Yuma

  # User für Frau Geissmann
  - name: geissmann
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # Public Key von Frau Geissmann
    ssh_authorized_keys:
      - ssh-rsa 

# Zusätzliches Paket: Apache-Webserver
packages:
  - apache2
# Vor der Installation apt update ausführen
package_update: true
# Danach alle Pakete aktualisieren
package_upgrade: true

write_files:
  # SSH-Härtung als eigene Konfigurationsdatei
  - path: /etc/ssh/sshd_config.d/01-m346-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    # PermitRootLogin no: Root darf sich nicht per SSH anmelden.
    # PasswordAuthentication no: Nur Schlüssel, kein Passwort.
    # KbdInteractiveAuthentication no: Keine interaktive Anmeldung per Tastatur-Abfrage.

runcmd:
  # SSH neu starten, damit die Härtung aktiv wird
  - systemctl restart ssh
  # Nachweis: Logdatei mit Datum, Prüfen mit: cat /var/log/m346.log
  - echo "Einrichtung durch cloud-init abgeschlossen am $(date)" > /var/log/m346.log

#cloud-config
# Brunner-Web: Webserver im Subnetz-Public

# Benutzer
# default = ubuntu bleibt (ohne Key Pair kein Login moeglich)
users:
  - default
  - name: simon
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      # mein Key
      - ssh-rsa 
      # Key Lehrer
      - ssh-rsa 

# SSH: kein root, kein Passwort
disable_root: true
ssh_pwauth: false
write_files:
  - path: /etc/ssh/sshd_config.d/01-m346-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

# Pakete updaten und installieren
package_update: true
package_upgrade: true
packages:
  - netcat-openbsd # fuer die Tests nc -zv
  - apache2 # Webserver

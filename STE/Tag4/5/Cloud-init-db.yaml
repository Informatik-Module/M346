#cloud-config
users:
  #default user plus key2
  - default
    #mein user plus mein key1
  - name: nick
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 
    #Geissmann user plus ihr key
  - name: geissmann
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 

#herunterladen der Pakete
packages:
  - mariadb-server
#files erstellen
write_files:
  - path: /etc/mysql/mariadb.conf.d/99-m346.cnf
    content: |
      [mysqld]
      bind-address = 0.0.0.0
#ausführen von CMD befehlen
runcmd:
  - echo "Alles hat funktioniert"

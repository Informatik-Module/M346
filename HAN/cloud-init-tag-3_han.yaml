#cloud-config
---
#Nutzer erstellen
users:
  - name: chantalhann
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 

#Pakete aktualisieren und installieren
packages:
  - apache2
package_update: true
package_upgrade: true

#SSH abhärten
write_files:
  - path: /etc/ssh/sshd_config.d/01-m346-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

#Befehle ausführen
runcmd:
  - echo "Einrichtung durch cloud-init abgeschlossen" > /var/log/m346.log

#cloud-config
# Define the default account and additional SSH-enabled administrators.
users: # Configure the accounts that cloud-init should create.
  - default # Keep the distribution's default user.

  - name: Adam # Create the Adam account.
    groups: sudo # Add Adam to the sudo group.
    sudo: ALL=(ALL) NOPASSWD:ALL # Allow Adam to run sudo commands without a password.
    shell: /bin/bash # Use Bash as Adam's login shell.
    ssh_authorized_keys: # Install public keys permitted to log in to Adam over SSH.
      - ssh-rsa  # Adam's SSH public key.
  - name: IG # Create the IG account.
    groups: sudo # Add IG to the sudo group.
    sudo: ALL=(ALL) NOPASSWD:ALL # Allow IG to run sudo commands without a password.
    shell: /bin/bash # Use Bash as IG's login shell.
    ssh_authorized_keys: # Install public keys permitted to log in to IG over SSH.
      - ssh-rsa  # IG's SSH public key.

# Install MariaDB after refreshing and upgrading the package index.
packages: # Packages that cloud-init should install.
  - mariadb-server # Install the MariaDB database server.
package_update: true # Refresh the package index before installing packages.
package_upgrade: true # Upgrade installed packages during initialization.

# Write MariaDB's network-listener configuration.
write_files: # Create or update files on the instance.
    - path: /etc/mysql/mariadb.conf.d/99-m346.cnf
      owner: root:root
      permissions: '0644'
      content: |
      [mysqld]
      bind-address = 0.0.0.0

    - path: /etc/mysql/mariadb.conf.d/99-m346.cnf
      owner: root:root
      permissions: '0644'
      content: |
      [mysqld]
      bind-address = 0.0.0.0
# Start MariaDB and record a marker when cloud-init setup finishes.
runcmd: # Commands to execute after the instance has booted.
  - systemctl enable mariadb
  - systemctl restart mariadb
  - echo "Einrichtung durch cloud-init abgeschlossen" > /var/log/m346.log # Record completion of the cloud-init setup.

#cloud-config
users:
  - default
  - name: isabel
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa 

package_update: true
package_upgrade: true
packages:
  - apache2

write_files:
  - path: /etc/ssh/sshd_config.d/01-m346-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

runcmd:
  - systemctl reload ssh
  - echo "Einrichtung durch cloud-init abgeschlossen" > /var/log/m346.log

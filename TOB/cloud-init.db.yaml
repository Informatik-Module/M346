#cloud-config
users:
  - default
  - name: jannick
    groups: sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII+vthUFJjjjJ/dN42bAfECCzcncLUNwes8Hrp8qiAb5 # lokaler key auf meinem laptop

package_update: true
package_upgrade: true
packages:
  - mariadb-server

write_files:
  - path: /etc/ssh/sshd_config.d/01-m346-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/mysql/mariadb.conf.d/99-m346.cnf
    content: |
      [mysqld]
      bind-address = 0.0.0.0

runcmd:
  - systemctl reload ssh
  - systemctl enable --now mariadb
  - systemctl restart mariadb
  - mariadb -e "CREATE DATABASE IF NOT EXISTS modul346;"
  - mariadb -e "CREATE USER IF NOT EXISTS 'jannick'@'%' IDENTIFIED BY 'Passwort123.';"
  - mariadb -e "GRANT ALL PRIVILEGES ON modul346.* TO 'jannick'@'%';"
  - |-
    printf "----------------------------------------------\n
    [!] Einrichtung durch cloud-init abgeschlossen\n
    [*] Teste mit 'mariadb -h $(hostname -i) -u jannick -pPasswort123. modul346'\n" >> /etc/motd
